image: registry.toolkit-sp.yul201.service-now.com/snow.research.tapes/interactive-toolkit:throughput
name: privacy_helper_2gpu
workdir: /home/toolkit/my_code/MosaicProject
# This helper intentionally points at the rebuilt local index root from
# 2026-04-15. The previous root contained stale task-local extraction output
# from before python-docx/openpyxl/python-pptx/PyPDF2/pdfplumber/xlrd were
# installed in the pipeline-rl env, which caused placeholders like
# "python-docx library not available" to be indexed as document content.
# If you rebuild the local indices again, update this path explicitly rather
# than assuming /mnt/llmd/results/exps/alexg/privacy_agent/local_indices is safe.
#
# This variant uses the second helper GPU for BrowseComp dense retrieval via
# the torch fallback in BrowseCompHybridSearcher. Do not install faiss-gpu-cu12
# here: the current PyPI wheels abort on H100 with CUDA error 209 ("no kernel
# image is available for execution on the device") because their FAISS kernels
# are not built for sm_90.
command:
  - /opt/conda/bin/conda
  - run
  - -n
  - pipeline-rl
  - --no-capture-output
  - python
  - -m
  - trajectory_generation.src.retrieval.privacy_helper_stack
  - --host
  - 0.0.0.0
  - --port
  - '8012'
  - --local-index-root
  - /mnt/llmd/results/exps/alexg/privacy_agent/local_indices_fixeddeps_20260415
  - --workers
  - '16'
  - --threadpool-tokens
  - '16'
  - --browsecomp-index-glob
  - /home/toolkit/BrowseComp-Plus/indexes/qwen3-embedding-4b/corpus.shard*_of_*.pkl
  - --browsecomp-corpus
  - Tevatron/browsecomp-plus-corpus
  - --browsecomp-index-device
  - cuda:1
  - --browsecomp-bm25-recall-k
  - '100'
  - --browsecomp-dense-recall-k
  - '100'
  - --browsecomp-max-chars
  - '0'
  - --browsecomp-exclude-doc-ids-file
  - /home/toolkit/my_code/MosaicProject/data_files/privacy_hopqa_final_dataset/browsecomp_doc_ids_over_10_windows_2026-05-12.txt
  - --browsecomp-max-doc-windows
  - '10'
  - --browsecomp-reader-window-chars
  - '16000'
  - --browsecomp-reader-window-overlap-chars
  - '1000'
  - --curated-web-docs
  - /home/toolkit/my_code/MosaicProject/data_files/privacy_hopqa_final_dataset/curated_source_shortdocs_q24_2026-05-12/docs_curated_web_plus_privacy_hopqa_q24.jsonl
  - --curated-web-chunks
  - /home/toolkit/my_code/MosaicProject/trajectory_generation/data/chunks_curated_web.jsonl
  - --curated-web-chunks
  - /home/toolkit/my_code/MosaicProject/data_files/privacy_hopqa_final_dataset/curated_source_shortdocs_q19_2026-05-12/chunks_curated_web_privacy_hopqa_q19.jsonl
  - --curated-web-chunks
  - /home/toolkit/my_code/MosaicProject/data_files/privacy_hopqa_final_dataset/curated_source_shortdocs_q20_2026-05-12/chunks_curated_web_privacy_hopqa_q20.jsonl
  - --curated-web-chunks
  - /home/toolkit/my_code/MosaicProject/data_files/privacy_hopqa_final_dataset/curated_source_shortdocs_q21_2026-05-12/chunks_curated_web_privacy_hopqa_q21.jsonl
  - --curated-web-chunks
  - /home/toolkit/my_code/MosaicProject/data_files/privacy_hopqa_final_dataset/curated_source_shortdocs_q24_2026-05-12/chunks_curated_web_privacy_hopqa_q24.jsonl
  - --embedding-model
  - Qwen/Qwen3-Embedding-4B
data:
  - 'snow.home.alex_gurung:/home/toolkit'
  - 'snow.home.alex_gurung:/transformers_cache:ro'
  - 'snow.research.tapes.data:/mnt/llmd/data:ro'
  - 'snow.research.rlar.results:/mnt/llmd/results:ro'
  - 'snow.research.tapes.base_models:/mnt/llmd/base_models:ro'
environmentVars:
  - HOME=/home/toolkit
  - XDG_CACHE_HOME=/home/toolkit/.cache
  - HF_HOME=/home/toolkit/.cache/huggingface
  - HF_HUB_CACHE=/home/toolkit/.cache/huggingface/hub
  - HF_DATASETS_CACHE=/home/toolkit/.cache/huggingface/datasets
  - HF_HUB_ENABLE_HF_TRANSFER=0
  - PYTHONNOUSERSITE=1
  - PYTHONPATH=/home/toolkit/my_code/MosaicProject
  - PORT=8012
  - PRIVACY_HELPER_EMBED_PORT=8000
  - PRIVACY_HELPER_MODEL_CACHE_ROOT=/transformers_cache/hub
  - OMP_NUM_THREADS=2
  - MKL_NUM_THREADS=2
  - OPENBLAS_NUM_THREADS=2
  - NUMEXPR_NUM_THREADS=2
options:
  internal-dns:
    name: dns-privacy-helper
    ports:
      - port: 8012
        protocol: TCP
        target-port: 8012
resources:
  cpu: 96
  gpu: 2
  gpuMem: 80
  mem: 384
preemptable: true
restartable: true
