[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mosaicleaks"
version = "0.1.0"
description = "Dataset generation and retrieval utilities for MosaicLeaks"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "beautifulsoup4>=4.12.0",
    "httpx>=0.27.0",
    "numpy>=1.26.0",
    "openai>=1.0.0",
    "openpyxl>=3.1.0",
    "pydantic>=2.0.0",
    "pypdf>=4.2.0",
    "python-docx>=1.1.0",
    "requests>=2.31.0",
    "spacy>=3.7.0",
]

[project.optional-dependencies]
browsecomp = [
    "datasets>=2.18.0",
    "faiss-cpu>=1.8.0",
    "torch>=2.1.0",
    "transformers>=4.41.0",
]
dense = [
    "sentence-transformers>=3.0.0",
]
server = [
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
]
dev = [
    "pytest>=8.0.0",
]
viewer = [
    "rich>=13.7.0",
    "textual>=0.85.0",
]

[project.scripts]
mosaicleaks-generate = "mosaicleaks.run:main"
mosaicleaks-publish-dataset = "mosaicleaks.publish_dataset:main"
mosaicleaks-browsecomp-server = "mosaicleaks.src.retrieval.browsecomp_hybrid_server:main"
mosaicleaks-retrieval-helper = "mosaicleaks.src.retrieval.retrieval_helper_server:main"
mosaicleaks-retrieval-helper-stack = "mosaicleaks.src.retrieval.retrieval_helper_stack:main"
mosaicleaks-retrieval-helper-smoke = "mosaicleaks.scripts.retrieval_helper_smoke:main"
mosaicleaks-fetch-curated-urls = "mosaicleaks.data_prep.fetch_drbench_urls:main"
mosaicleaks-chunk-local = "mosaicleaks.data_prep.chunk_local_tasks:main"
mosaicleaks-extract-secrets = "mosaicleaks.data_prep.extract_local_secrets:main"
mosaicleaks-filter-secrets = "mosaicleaks.data_prep.filter_local_secrets:main"
mosaicleaks-view-generation = "mosaicleaks.scripts.view_generation:main"
mosaicleaks-view-chains = "mosaicleaks.scripts.view_chains:main"

[tool.setuptools.packages.find]
include = ["mosaicleaks*"]

[tool.pytest.ini_options]
addopts = "-q"
