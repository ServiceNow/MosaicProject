[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mosaicproject"
version = "0.1.0"
description = "Standalone trajectory generation package for multi-hop research chains"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "beautifulsoup4>=4.12.0",
    "httpx>=0.27.0",
    "numpy>=1.26.0",
    "openai>=1.0.0",
    "openpyxl>=3.1.0",
    "pypdf>=4.2.0",
    "python-docx>=1.1.0",
    "requests>=2.31.0",
    "spacy>=3.7.0",
]

[project.optional-dependencies]
search = [
    "datasets>=2.18.0",
    "torch>=2.1.0",
    "transformers>=4.41.0",
]
dense = [
    "sentence-transformers>=3.0.0",
]
server = [
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
]
dev = [
    "pytest>=8.0.0",
]
viewer = [
    "rich>=13.7.0",
    "textual>=0.85.0",
]
reward = [
    "flash-attn>=2.8.0",
    "liger-kernel>=0.8.0",
    "matplotlib>=3.8.0",
    "peft>=0.18.0",
    "scikit-learn>=1.5.0",
    "trl>=1.4.0",
    "wandb>=0.26.0",
]

[project.scripts]
trajectory-generate = "trajectory_generation.run:main"
trajectory-browsecomp-server = "trajectory_generation.src.retrieval.browsecomp_hybrid_server:main"
trajectory-privacy-helper = "trajectory_generation.src.retrieval.privacy_helper_server:main"
trajectory-privacy-helper-stack = "trajectory_generation.src.retrieval.privacy_helper_stack:main"
trajectory-privacy-helper-smoke = "trajectory_generation.scripts.privacy_helper_smoke:main"
trajectory-fetch-curated-urls = "trajectory_generation.data_prep.fetch_drbench_urls:main"
trajectory-chunk-local = "trajectory_generation.data_prep.chunk_local_tasks:main"
trajectory-extract-secrets = "trajectory_generation.data_prep.extract_local_secrets:main"
trajectory-filter-secrets = "trajectory_generation.data_prep.filter_local_secrets:main"
trajectory-view-generation = "trajectory_generation.scripts.view_generation:main"
trajectory-view-chains = "trajectory_generation.scripts.view_chains:main"

[tool.setuptools.packages.find]
include = ["trajectory_generation*"]

[tool.pytest.ini_options]
addopts = "-q"
