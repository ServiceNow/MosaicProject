<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Privacy HopQA Dataset Viewer</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}body{font-family:ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:14px;background:#f6f4ef;color:#25221d;display:flex;height:100vh;overflow:hidden}#sidebar{width:360px;min-width:360px;background:#ebe5d8;border-right:1px solid #d7cfbf;display:flex;flex-direction:column}#sidebar h2{padding:14px 16px;font-size:16px;background:#ded5c3;border-bottom:1px solid #cfc5b3}#filter-bar{padding:10px;border-bottom:1px solid #d7cfbf;display:flex;gap:6px;flex-wrap:wrap}select,input{background:#fffdf8;border:1px solid #c8bda9;border-radius:5px;padding:5px 7px;font-size:12px}input{flex:1;min-width:140px}#chain-list{flex:1;overflow-y:auto}.ci{padding:9px 13px;cursor:pointer;border-bottom:1px solid #ded6c7;display:flex;justify-content:space-between;gap:8px;font-size:12px}.ci:hover{background:#e2dacb}.ci.active{background:#cfdecd}.cid{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;color:#5e594f}.meta{display:flex;gap:4px;align-items:flex-start;flex-wrap:wrap;justify-content:flex-end}.b{padding:2px 6px;border-radius:999px;font-size:10px;font-weight:700;white-space:nowrap}.b-l{background:#386641;color:#fff}.b-w{background:#315f83;color:#fff}.b-ed{background:#bd6b24;color:#fff}.b-ac{background:#386641;color:#fff}.b-warn{background:#e0a100;color:#251d00}.b-alt{background:#684f8f;color:#fff}#side-stats{padding:10px 14px;border-top:1px solid #d7cfbf;font-size:12px;color:#665f53;line-height:1.45}#main{flex:1;display:flex;flex-direction:column;overflow:hidden}#tb{padding:10px 16px;background:#fffdf8;border-bottom:1px solid #d7cfbf;display:flex;gap:8px;align-items:center;flex-wrap:wrap}button{padding:7px 13px;border:none;border-radius:6px;cursor:pointer;font-size:13px;font-weight:700;background:#2f3e46;color:#fff}.secondary{background:#766f63}.sp{flex:1}.ni{font-size:12px;color:#655e53}.tag{background:#e7dfd0;padding:3px 8px;border-radius:999px;font-size:12px;display:inline-block;margin:2px 4px 2px 0}#content{flex:1;overflow-y:auto;padding:18px 24px}.panel{background:#fffdf8;border:1px solid #d7cfbf;border-radius:10px;padding:14px;margin-bottom:14px}.panel-title{font-size:11px;font-weight:800;color:#81786a;text-transform:uppercase;letter-spacing:.06em;margin-bottom:9px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}.stat-card{background:#fbf7ee;border:1px solid #ded6c7;border-radius:10px;padding:12px}.stat-card b{font-size:24px;display:block}.stat-card span{font-size:11px;color:#756d60;text-transform:uppercase}.hop-detail{background:#fffdf8;border:1px solid #d7cfbf;border-radius:10px;padding:14px 16px;margin-bottom:10px}.hop-q{font-size:14px;line-height:1.45;margin:8px 0}.hop-a{font-weight:800;color:#242424;font-size:15px;margin-bottom:6px}.hop-doc{font-size:11px;color:#766f63;margin-top:7px;word-break:break-all}.hop-span{background:#f6f0e5;border-left:4px solid #b8a98e;padding:9px 12px;font-size:12px;color:#514b42;line-height:1.5;white-space:pre-wrap;word-break:break-word;margin-top:8px}.variants{font-size:11px;color:#645d52;margin-top:6px}.variants code{background:#eee5d5;padding:2px 5px;border-radius:4px;margin:0 3px 3px 0;display:inline-block}.altbox{background:#f3eefb;border-left:4px solid #684f8f;padding:8px 10px;border-radius:6px;margin-top:8px}.warn{background:#fff3cd;border-left:4px solid #d49a00;padding:8px 12px;margin:8px 0;font-size:13px}.plot-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(360px,1fr));gap:14px}.plot-grid img{width:100%;background:#fff;border:1px solid #d7cfbf;border-radius:10px;padding:8px}table{width:100%;border-collapse:collapse;font-size:12px}td,th{border-bottom:1px solid #eee1cd;text-align:left;padding:5px 7px}th{color:#776f62;font-size:11px;text-transform:uppercase}pre{white-space:pre-wrap;font-family:inherit;line-height:1.45}
</style>
</head>
<body>
<div id="sidebar"><h2>Privacy HopQA <span id="tc"></span></h2><div id="filter-bar"><select id="ft"><option value="all">All tasks</option></select><select id="fp"><option value="all">All patterns</option></select><select id="fc"><option value="all">All companies</option></select><select id="fq"><option value="all">All chains</option><option value="lw">Has L→W</option><option value="wl">Has W→L</option><option value="alt">Has alternate answers</option></select><input id="fx" placeholder="Search chain/company/doc/question..."></div><div id="chain-list"></div><div id="side-stats"></div></div>
<div id="main"><div id="tb"><button class="secondary" id="bp">Prev</button><button id="bn">Next</button><span class="ni" id="ni"></span><span class="sp"></span><button class="secondary" id="ba">Analysis</button><button class="secondary" id="bl">Plots</button><button id="bd">Dataset</button></div><div id="content"><p style="padding:40px;color:#81786a;text-align:center">Loading finalized dataset...</p></div></div>
<script>
let D=[],STATS={},UNIQ={},AN={},SPLIT={},F=[],C=0,mode='dataset';
async function fetchJSON(p){const r=await fetch(p);if(!r.ok)throw new Error(p+' '+r.status);return r.json()}async function fetchJSONL(p){const txt=await(await fetch(p)).text();return txt.trim().split(/\n+/).filter(Boolean).map(x=>JSON.parse(x))}function esc(s){return s==null?'':String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}function uniq(a){return [...new Set(a.filter(Boolean))].sort()}function hasAlt(d){return (d.hops||[]).some(h=>(h.alternate_valid_answers||[]).length)}function table(obj,limit=60){return '<table><tr><th>Value</th><th>Count</th></tr>'+Object.entries(obj||{}).sort((a,b)=>b[1]-a[1]).slice(0,limit).map(([k,v])=>`<tr><td>${esc(k)}</td><td>${v}</td></tr>`).join('')+'</table>'}
async function init(){try{D=await fetchJSONL('privacy_hopqa_finalized_2026-05-07_answer_variants.jsonl');STATS=await fetchJSON('dataset_stats.json');try{UNIQ=await fetchJSON('question_uniqueness_stats.json')}catch(e){UNIQ={}}try{AN=await fetchJSON('dataset_analysis.json')}catch(e){AN={}}try{SPLIT=await fetchJSON('split_manifest.json')}catch(e){SPLIT={}}}catch(e){content.innerHTML='<p style="padding:40px;color:#a00">Error loading dataset: '+esc(e.message)+'<br><br>Serve this directory with <code>python3 -m http.server</code>.</p>';return}fillFilters();filter();sel(0)}
function fillFilters(){ft.innerHTML='<option value="all">All tasks</option>'+uniq(D.map(d=>d.task_id)).map(x=>`<option>${esc(x)}</option>`).join('');fp.innerHTML='<option value="all">All patterns</option>'+uniq(D.map(d=>d.pattern)).map(x=>`<option>${esc(x)}</option>`).join('');fc.innerHTML='<option value="all">All companies</option>'+uniq(D.map(d=>d.company)).map(x=>`<option>${esc(x)}</option>`).join('')}
function filter(){const t=ft.value,p=fp.value,c=fc.value,q=fq.value,s=fx.value.toLowerCase();F=D.filter(d=>{if(t!=='all'&&d.task_id!==t)return false;if(p!=='all'&&d.pattern!==p)return false;if(c!=='all'&&d.company!==c)return false;if(q==='lw'&&!d.has_local_to_web_transition)return false;if(q==='wl'&&!d.has_web_to_local_transition)return false;if(q==='alt'&&!hasAlt(d))return false;if(s){const hay=[d.chain_id,d.task_id,d.company,d.pattern,d.global_answer,...(d.hops||[]).flatMap(h=>[h.question_templated,h.question,h.answer,h.doc_id,(h.accepted_answer_variants||[]).join(' ')])].join(' ').toLowerCase();if(!hay.includes(s))return false}return true});if(C>=F.length)C=Math.max(0,F.length-1);renderList();renderSide();if(mode==='dataset')sel(C);else if(mode==='analysis')analysis();else plots()}
function renderList(){document.getElementById('chain-list').innerHTML=F.map((d,i)=>`<div class="ci${i===C&&mode==='dataset'?' active':''}" onclick="mode='dataset';sel(${i})"><div><span style="color:#968d7d;font-size:10px;margin-right:4px">${i+1}</span><span class="cid">${esc(d.chain_id)}</span><br><span style="font-size:11px;color:#776f62">${esc(d.task_id)} · ${esc(d.company)}</span></div><div class="meta"><span class="b ${d.review_status==='edited'?'b-ed':'b-ac'}">${esc(d.review_status)}</span><span class="b b-l">${d.n_local_hops}L</span><span class="b b-w">${d.n_web_hops}W</span><span class="b b-alt">${d.n_effective_doc_hops||'?'} eff</span>${hasAlt(d)?'<span class="b b-alt">alts</span>':''}</div></div>`).join('');tc.textContent=`(${F.length})`}
function renderSide(){document.getElementById('side-stats').innerHTML=`Showing <b>${F.length}</b> / ${D.length} chains<br>Total hops: <b>${F.reduce((a,d)=>a+(d.n_hops||0),0)}</b><br>L→W chains: <b>${F.filter(d=>d.has_local_to_web_transition).length}</b><br>W→L chains: <b>${F.filter(d=>d.has_web_to_local_transition).length}</b><br>Alt-answer chains: <b>${F.filter(hasAlt).length}</b>`}
function sel(i){if(!F.length){content.innerHTML='<p style="padding:40px;color:#81786a">No rows match filters.</p>';return}mode='dataset';C=Math.max(0,Math.min(i,F.length-1));renderList();const d=F[C];ni.textContent=`${C+1} / ${F.length}`;content.innerHTML=chain(d)}
function chain(d){return `<div class="panel"><div class="panel-title">Chain</div><h2>${esc(d.problem_id)}</h2><p><span class="tag">${esc(d.task_id)}</span><span class="tag">${esc(d.company)}</span><span class="tag">${esc(d.pattern)}</span><span class="tag">${d.n_hops} hops</span><span class="tag">${d.n_effective_doc_hops} effective doc hops</span><span class="tag">${d.n_effective_type_hops} effective type hops</span></p><pre>${esc(d.numbered_questions)}</pre><p style="margin-top:8px"><b>Global answer:</b> ${esc(d.global_answer)}</p><div class="altbox"><b>Global accepted answers:</b> ${(d.global_answer_variants||[]).map(v=>`<code>${esc(v)}</code>`).join(' ')}</div></div>`+(d.hops||[]).map(h=>hop(h)).join('')}
function issueLabel(x){return ({ambiguous_pronoun:'Ambiguous pronoun',missing_space_before_marker:'Missing space before marker'}[x]||x).replace(/_/g,' ')}
function sourceLine(h){const rows=h.answer_variant_sources||[];if(!rows.length)return '';return `<details style="margin-top:8px"><summary><b>Variant sources</b> (${rows.length})</summary><div class="variants">${rows.map(r=>`<code>${esc(r.variant)} · ${esc((r.sources||[]).join('+'))}</code>`).join(' ')}</div></details>`}
function hop(h){const issues=(h.question_issues||[]).map(issueLabel).map(esc).join(', ');const vars=h.accepted_answer_variants||[],alts=h.alternate_valid_answers||[];return `<div class="hop-detail"><div><span class="b ${h.hop_type==='L'?'b-l':'b-w'}">${esc(h.hop_type)}</span> <b>Hop ${h.hop_number}</b> <span class="tag">${esc(h.doc_inferred_by)}</span><span class="tag">${vars.length} accepted answers</span>${alts.length?`<span class="tag">${alts.length} alternates</span>`:''}</div>${issues?`<div class="warn"><b>Question issue:</b> ${issues}</div>`:''}<div class="hop-q">${esc(h.question_templated||h.question)}</div><div class="hop-a">Canonical answer: ${esc(h.answer)}</div><div class="altbox"><b>Accepted answers for exact-match eval (${vars.length}):</b><div class="variants">${vars.map(v=>`<code>${esc(v)}</code>`).join(' ')}</div>${alts.length?`<b>Alternates only (${alts.length}):</b><div class="variants">${alts.map(v=>`<code>${esc(v)}</code>`).join(' ')}</div>`:''}${sourceLine(h)}</div><div class="hop-doc">${esc(h.doc_id)}${h.doc_ref?' · '+esc(h.doc_ref):''}</div>${h.supporting_span?`<div class="hop-span">${esc(h.supporting_span)}</div>`:''}</div>`}
function splitPanel(){if(!SPLIT||!SPLIT.counts)return '';return `<div class="panel"><div class="panel-title">Canonical train / val / test split</div><p><b>Strategy:</b> ${esc(SPLIT.strategy)}. <b>Held-out test company:</b> ${esc(SPLIT.test_company)}.</p>${table(SPLIT.counts)}</div>`}
function analysis(){mode='analysis';renderList();ni.textContent='Analysis';const a=AN||{},u=UNIQ||{};content.innerHTML=`<div class="panel"><div class="panel-title">Summary</div><div class="grid"><div class="stat-card"><b>${a.n_chains||D.length}</b><span>chains</span></div><div class="stat-card"><b>${a.n_hops_total||''}</b><span>hop questions</span></div><div class="stat-card"><b>${(a.transition_summary||{}).has_local_to_web||0}</b><span>chains with L→W</span></div><div class="stat-card"><b>${(a.transition_summary||{}).has_web_to_local||0}</b><span>chains with W→L</span></div><div class="stat-card"><b>${u.n_approx_unique_clusters||''}</b><span>approx unique questions</span></div><div class="stat-card"><b>${a.n_hops_with_alternate_valid_answers||0}</b><span>hops with alternates</span></div></div></div>${splitPanel()}<div class="panel"><div class="panel-title">Definitions</div>${Object.entries(a.definitions||{}).map(([k,v])=>`<p><b>${esc(k)}:</b> ${esc(v)}</p>`).join('')}</div><div class="panel"><div class="panel-title">Transition summary</div>${table(a.transition_summary)}</div><div class="panel"><div class="panel-title">Explicit hops</div>${table((a.hops_per_chain||{}).distribution)}</div><div class="panel"><div class="panel-title">Effective doc hops</div>${table((a.effective_doc_hops_per_chain||{}).distribution)}</div><div class="panel"><div class="panel-title">Effective type hops</div>${table((a.effective_type_hops_per_chain||{}).distribution)}</div><div class="panel"><div class="panel-title">Pattern frequency</div>${table(a.pattern_frequency,80)}</div><div class="panel"><div class="panel-title">Company frequency</div>${table(a.company_frequency,80)}</div><div class="panel"><div class="panel-title">Task frequency</div>${table(a.task_frequency,120)}</div>`}
function plots(){mode='plots';renderList();ni.textContent='Plots';const imgs=['hops_per_chain.png','effective_doc_hops_per_chain.png','effective_type_hops_per_chain.png','unique_docs_per_chain.png','local_to_web_transitions.png','transition_summary.png','top_patterns.png','top_companies.png','top_tasks.png','answer_variants_per_hop.png'];content.innerHTML=`<div class="panel"><div class="panel-title">Distribution plots</div><p>Generated from <code>dataset_analysis.json</code>.</p></div><div class="plot-grid">${imgs.map(x=>`<img src="plots/${x}" alt="${esc(x)}">`).join('')}</div>`}
bp.onclick=()=>sel(C-1);bn.onclick=()=>sel(C+1);ba.onclick=analysis;bl.onclick=plots;bd.onclick=()=>sel(C);[ft,fp,fc,fq,fx].forEach(e=>e.oninput=filter);document.addEventListener('keydown',e=>{if(e.key==='ArrowLeft')sel(C-1);if(e.key==='ArrowRight')sel(C+1)});init();
</script>
</body>
</html>
