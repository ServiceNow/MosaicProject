<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Privacy HopQA Dataset Viewer</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,sans-serif;font-size:14px;background:#f5f5f5;display:flex;height:100vh;overflow:hidden;color:#222}
#sidebar{width:340px;min-width:340px;background:#f0f0f0;color:#333;display:flex;flex-direction:column;overflow:hidden;border-right:1px solid #ddd}
#sidebar h2{padding:12px;font-size:15px;border-bottom:1px solid #ddd;background:#e8e8e8;color:#333}
#filter-bar{padding:8px;border-bottom:1px solid #ddd;display:flex;gap:4px;flex-wrap:wrap}
#filter-bar select,#filter-bar input{background:#fff;color:#333;border:1px solid #ccc;border-radius:3px;padding:3px 6px;font-size:12px}
#filter-bar input{flex:1;min-width:110px}
#chain-list{flex:1;overflow-y:auto}
.ci{padding:8px 12px;cursor:pointer;border-bottom:1px solid #e0e0e0;display:flex;justify-content:space-between;align-items:center;font-size:12px;gap:6px}
.ci:hover{background:#e4e4e4}
.ci.active{background:#d0e4f5}
.ci .cid{font-family:monospace;color:#555}
.ci .meta{display:flex;gap:4px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.b{padding:1px 5px;border-radius:3px;font-size:10px;font-weight:bold;white-space:nowrap}
.b-l{background:#2d6a4f;color:#fff}.b-w{background:#457b9d;color:#fff}.b-man{background:#c1121f;color:#fff}.b-warn{background:#ffba08;color:#000}.b-ed{background:#f77f00;color:#fff}.b-ac{background:#2d6a4f;color:#fff}
#stats{padding:8px 12px;border-top:1px solid #ddd;font-size:11px;color:#666;line-height:1.45}
#main{flex:1;display:flex;flex-direction:column;overflow:hidden}
#tb{padding:8px 16px;background:#fff;border-bottom:1px solid #ddd;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
#tb button{padding:6px 14px;border:none;border-radius:4px;cursor:pointer;font-size:13px;font-weight:600}
#tb .sp{flex:1}.ni{font-size:12px;color:#666}.tag{background:#e9ecef;padding:2px 8px;border-radius:3px;font-size:12px;display:inline-block;margin-right:4px}
#content{flex:1;overflow-y:auto;padding:16px 24px}
.panel{background:#fff;border:1px solid #ddd;border-radius:6px;padding:12px;margin-bottom:12px}
.panel-title{font-size:11px;font-weight:bold;color:#888;text-transform:uppercase;letter-spacing:0.5px;margin-bottom:8px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.stat-card{background:#fff;border:1px solid #ddd;border-radius:6px;padding:10px}.stat-card b{font-size:20px;display:block}.stat-card span{font-size:11px;color:#777;text-transform:uppercase}
.hop-detail{background:#fff;border:1px solid #ddd;border-radius:6px;padding:12px 16px;margin-bottom:8px}
.hop-q{font-size:14px;line-height:1.4;margin-bottom:5px}.hop-a{font-weight:bold;color:#1a1a2e;font-size:14px;margin-bottom:6px}
.hop-doc{font-size:11px;color:#777;margin-top:5px;word-break:break-all}.hop-span{background:#f8f9fa;border-left:3px solid #dee2e6;padding:8px 12px;font-size:12px;color:#555;line-height:1.5;white-space:pre-wrap;word-break:break-word;margin-top:6px}
.variants{font-size:11px;color:#666;margin-top:5px}.variants code{background:#f0f0f0;padding:1px 4px;border-radius:2px;margin:0 2px;display:inline-block;margin-bottom:2px}
.warn{background:#fff3cd;border-left:4px solid #ffc107;padding:8px 12px;margin-bottom:12px;font-size:13px}
.manual{background:#fff0f0;border-left:4px solid #c1121f;padding:8px 12px;margin-bottom:12px;font-size:13px}
table{width:100%;border-collapse:collapse;font-size:12px}td,th{border-bottom:1px solid #eee;text-align:left;padding:4px 6px}th{color:#777;font-size:11px;text-transform:uppercase}
</style>
</head>
<body>
<div id="sidebar">
  <h2>Privacy HopQA <span id="tc"></span></h2>
  <div id="filter-bar">
    <select id="ft"><option value="all">All tasks</option></select>
    <select id="fp"><option value="all">All patterns</option></select>
    <select id="fr"><option value="all">All review</option><option value="accepted">Accepted</option><option value="edited">Edited</option></select>
    <select id="fq"><option value="all">All quality</option><option value="manual">Manual required</option><option value="warnings">Question warnings</option></select>
    <input id="fx" placeholder="Search chain/company/doc...">
  </div>
  <div id="chain-list"></div>
  <div id="stats"></div>
</div>
<div id="main">
  <div id="tb">
    <button id="bp" style="background:#6c757d;color:#fff">Prev</button>
    <button id="bn" style="background:#457b9d;color:#fff">Next</button>
    <span class="ni" id="ni"></span>
    <span class="sp"></span>
    <button id="bs" style="background:#333;color:#fff">Stats</button>
    <button id="bd" style="background:#333;color:#fff">Dataset</button>
  </div>
  <div id="content"><p style="padding:40px;color:#888;text-align:center">Loading finalized dataset...</p></div>
</div>
<script>
let D=[],STATS={},UNIQ={},F=[],C=0,mode='dataset';
async function fetchJSON(p){const r=await fetch(p);if(!r.ok)throw new Error(p+' '+r.status);return r.json();}
async function fetchJSONL(p){const txt=await(await fetch(p)).text();return txt.trim().split(/\n+/).filter(Boolean).map(x=>JSON.parse(x));}
function esc(s){return s==null?'':String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function countManual(d){return (d.hops||[]).filter(h=>h.doc_inferred_by==='manual_required').length}
function countWarn(d){return (d.hops||[]).filter(h=>!h.question_well_formed||(h.question_issues||[]).length).length}
function uniq(arr){return [...new Set(arr.filter(Boolean))].sort()}
async function init(){
  try{
    D=await fetchJSONL('privacy_hopqa_finalized_2026-05-05.jsonl');
    STATS=await fetchJSON('dataset_stats.json');
    try{UNIQ=await fetchJSON('question_uniqueness_stats.json')}catch(e){UNIQ={}}
  }catch(e){
    document.getElementById('content').innerHTML='<p style="padding:40px;color:#c00">Error loading dataset: '+esc(e.message)+'<br><br>Serve this folder with <code>python3 -m http.server</code> after export finishes.</p>';return;
  }
  fillFilters();filter();renderStatsBox();sel(0);
}
function fillFilters(){
  const ft=document.getElementById('ft'), fp=document.getElementById('fp');
  ft.innerHTML='<option value="all">All tasks</option>'+uniq(D.map(d=>d.task_id)).map(x=>`<option>${esc(x)}</option>`).join('');
  fp.innerHTML='<option value="all">All patterns</option>'+uniq(D.map(d=>d.pattern)).map(x=>`<option>${esc(x)}</option>`).join('');
}
function filter(){
  const t=ft.value,p=fp.value,r=fr.value,q=fq.value,s=fx.value.toLowerCase();
  F=D.filter(d=>{
    if(t!=='all'&&d.task_id!==t)return false;
    if(p!=='all'&&d.pattern!==p)return false;
    if(r!=='all'&&d.review_status!==r)return false;
    if(q==='manual'&&!countManual(d))return false;
    if(q==='warnings'&&!countWarn(d))return false;
    if(s){
      const hay=[d.chain_id,d.task_id,d.company,d.pattern,...(d.hops||[]).flatMap(h=>[h.question_templated,h.answer,h.doc_id])].join(' ').toLowerCase();
      if(!hay.includes(s))return false;
    }
    return true;
  });
  if(C>=F.length)C=Math.max(0,F.length-1);
  renderList();renderStatsBox();if(mode==='dataset')sel(C);else renderStatsPage();
}
function renderList(){
  document.getElementById('chain-list').innerHTML=F.map((d,i)=>{
    const man=countManual(d), warn=countWarn(d);
    return `<div class="ci${i===C&&mode==='dataset'?' active':''}" onclick="mode='dataset';sel(${i})">
      <div><span style="color:#aaa;font-size:10px;margin-right:4px">${i+1}</span><span class="cid">${esc(d.chain_id)}</span><br><span style="font-size:11px;color:#888">${esc(d.task_id)} · ${esc(d.company)}</span></div>
      <div class="meta"><span class="b ${d.review_status==='edited'?'b-ed':'b-ac'}">${esc(d.review_status)}</span><span class="b b-l">${d.n_local_hops}L</span><span class="b b-w">${d.n_web_hops}W</span>${man?`<span class="b b-man">${man}M</span>`:''}${warn?`<span class="b b-warn">${warn}!</span>`:''}</div>
    </div>`;
  }).join('');
  tc.textContent=`(${F.length})`;
}
function renderStatsBox(){
  stats.innerHTML=`Showing <b>${F.length}</b> / ${D.length} chains<br>Total hops: <b>${F.reduce((a,d)=>a+d.n_hops,0)}</b><br>Manual chains: <b>${F.filter(countManual).length}</b><br>Warning chains: <b>${F.filter(countWarn).length}</b>`;
}
function sel(i){if(!F.length){content.innerHTML='<p style="padding:40px;color:#888">No rows match filters.</p>';return}C=Math.max(0,Math.min(i,F.length-1));renderList();const d=F[C];ni.textContent=`${C+1} / ${F.length}`;content.innerHTML=renderChain(d);}
function renderChain(d){
  const hopHtml=(d.hops||[]).map(h=>{
    const issues=(h.question_issues||[]).map(esc).join(', ');
    return `<div class="hop-detail">
      <div><span class="b ${h.hop_type==='L'?'b-l':'b-w'}">${esc(h.hop_type)}</span> <b>Hop ${h.hop_number}</b> <span class="tag">${esc(h.doc_inferred_by)}</span></div>
      ${h.doc_inferred_by==='manual_required'?'<div class="manual">Manual review required for this hop.</div>':''}
      ${issues?`<div class="warn"><b>Question issue:</b> ${issues}${h.suggested_rewrite?`<br><b>Suggested:</b> ${esc(h.suggested_rewrite)}`:''}</div>`:''}
      <div class="hop-q">${esc(h.question_templated)}</div>
      <div class="hop-a">Answer: ${esc(h.answer)}</div>
      <div class="variants">${(h.accepted_answer_variants||[]).slice(0,25).map(v=>`<code>${esc(v)}</code>`).join(' ')}</div>
      <div class="hop-doc">${esc(h.doc_id)}${h.doc_ref?' · '+esc(h.doc_ref):''}</div>
      ${h.supporting_span?`<div class="hop-span">${esc(h.supporting_span)}</div>`:''}
    </div>`;
  }).join('');
  return `<div class="panel"><div class="panel-title">Chain</div>
    <h2>${esc(d.problem_id)}</h2>
    <p><span class="tag">${esc(d.task_id)}</span><span class="tag">${esc(d.company)}</span><span class="tag">${esc(d.pattern)}</span><span class="tag">${esc(d.review_status)}</span></p>
    <pre style="white-space:pre-wrap;margin-top:10px;font-family:inherit;line-height:1.45">${esc(d.numbered_questions)}</pre>
    <p style="margin-top:8px"><b>Global answer:</b> ${esc(d.global_answer)}</p>
  </div>${hopHtml}`;
}
function tableFromObj(obj,limit=40){return '<table><tr><th>Value</th><th>Count</th></tr>'+Object.entries(obj||{}).sort((a,b)=>b[1]-a[1]).slice(0,limit).map(([k,v])=>`<tr><td>${esc(k)}</td><td>${v}</td></tr>`).join('')+'</table>'}
function renderStatsPage(){
  mode='stats';renderList();ni.textContent='Statistics';
  const h=STATS.hops_per_chain||{}, u=UNIQ||{};
  content.innerHTML=`<div class="panel"><div class="panel-title">Dataset summary</div><div class="grid">
    <div class="stat-card"><b>${STATS.n_chains||D.length}</b><span>chains</span></div>
    <div class="stat-card"><b>${STATS.n_hops_total||''}</b><span>hops</span></div>
    <div class="stat-card"><b>${STATS.n_unique_local_docs_total||''}</b><span>local docs</span></div>
    <div class="stat-card"><b>${STATS.n_unique_web_docs_total||''}</b><span>web docs</span></div>
    <div class="stat-card"><b>${u.n_approx_unique_clusters||'pending'}</b><span>est. unique hop questions</span></div>
    <div class="stat-card"><b>${u.duplicate_rate_approx!=null?Math.round(u.duplicate_rate_approx*100)+'%':'pending'}</b><span>approx duplicate rate</span></div>
  </div></div>
  <div class="panel"><div class="panel-title">Hops per chain</div><p>min ${h.min}, median ${h.median}, mean ${h.mean}, max ${h.max}</p>${tableFromObj(h.distribution)}</div>
  <div class="panel"><div class="panel-title">Pattern frequency</div>${tableFromObj(STATS.patterns)}</div>
  <div class="panel"><div class="panel-title">Doc inference</div>${tableFromObj(STATS.doc_inferred_by_breakdown)}</div>
  <div class="panel"><div class="panel-title">Question issues</div>${tableFromObj(STATS.question_issues_breakdown)}</div>
  <div class="panel"><div class="panel-title">Companies</div>${tableFromObj(STATS.by_company,80)}</div>
  <div class="panel"><div class="panel-title">Tasks</div>${tableFromObj(Object.fromEntries(Object.entries(STATS.by_task||{}).map(([k,v])=>[k,v.n_chains])),120)}</div>
  <div class="panel"><div class="panel-title">Largest near-duplicate question clusters</div>${(u.largest_clusters||[]).slice(0,20).map(c=>`<div class="hop-detail"><b>${c.size} similar questions</b><br>${esc(c.representative)}<div class="variants">${(c.examples||[]).slice(0,4).map(e=>`<code>${esc(e.chain_id)} h${e.hop_number}</code>`).join(' ')}</div></div>`).join('')||'Pending until uniqueness stats are generated.'}</div>`;
}
bp.onclick=()=>sel(C-1);bn.onclick=()=>sel(C+1);bs.onclick=renderStatsPage;bd.onclick=()=>{mode='dataset';sel(C)};[ft,fp,fr,fq,fx].forEach(e=>e.oninput=filter);
document.addEventListener('keydown',e=>{if(e.key==='ArrowLeft')sel(C-1);if(e.key==='ArrowRight')sel(C+1)});
init();
</script>
</body>
</html>
